@if (pages.length > 1) {
  <ul class="pagination">
    @for (page of pages; track page) {
      <li class="page-item" [class.active]="currentPageProps === page">
        <a class="page-link" [routerLink]="urlProps" [queryParams]="{ page: page }">
          {{ page }}
        </a>
      </li>
    }
  </ul>
}
